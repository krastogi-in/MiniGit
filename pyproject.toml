[project]
name = "minigit"
version = "0.1.0"
description = "A simplified Git clone for learning — content-addressable storage, trees, commits, and diffs"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
    "commitizen>=3.27",
    "import-linter>=2.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "S",     # flake8-bandit (security)
    "A",     # flake8-builtins
    "T20",   # flake8-print (flag print statements in library code)
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
]
ignore = [
    "T201",  # allow print in CLI tool
    "S101",  # allow assert in tests
    "S104",  # allow binding to 0.0.0.0 for dev server
    "S105",  # allow hardcoded secret key (educational project)
    "A002",  # hash param names match object model vocabulary
    "S201",  # Flask debug for local educational serve
    "S110",  # intentional silent PermissionError in dir suggest
    "B011",  # legacy tests use assert False; prefer pytest.raises over time
    "RUF005",  # existing diff_lines concatenation style
    "RUF012",  # Tree IGNORE_* class-level sets (pre-existing)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
omit = [
    "src/app.py",
    "src/cli.py",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"

[tool.importlinter]
root_packages = ["components", "backend", "frontend"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Components must not import backend or frontend"
type = "forbidden"
source_modules = ["components"]
forbidden_modules = ["backend", "frontend"]

[[tool.importlinter.contracts]]
name = "Backend must not import frontend or components"
type = "forbidden"
source_modules = ["backend"]
forbidden_modules = ["frontend", "components"]

[[tool.importlinter.contracts]]
name = "Frontend depends on components and backend only"
type = "layers"
layers = ["frontend", "backend", "components"]
