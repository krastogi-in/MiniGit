<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MiniGit{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            line-height: 1.6;
        }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }

        .navbar {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .navbar .logo {
            font-size: 20px;
            font-weight: 700;
            color: #f0f6fc;
        }
        .navbar a { color: #c9d1d9; }

        .container {
            max-width: 960px;
            margin: 24px auto;
            padding: 0 24px;
        }

        .flash {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .flash.success { background: #1b4332; border: 1px solid #2d6a4f; color: #95d5b2; }
        .flash.error { background: #4a1c1c; border: 1px solid #7a2c2c; color: #f8a0a0; }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            overflow: hidden;
        }
        .card-header {
            padding: 12px 16px;
            background: #1c2128;
            border-bottom: 1px solid #30363d;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-body { padding: 0; }
        .card-body.padded { padding: 16px; }

        .list-item {
            padding: 10px 16px;
            border-bottom: 1px solid #21262d;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item:hover { background: #1c2128; }

        .icon { width: 20px; text-align: center; flex-shrink: 0; }

        .btn {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid #30363d;
            cursor: pointer;
            background: #21262d;
            color: #c9d1d9;
        }
        .btn:hover { background: #30363d; text-decoration: none; }
        .btn-primary {
            background: #238636;
            border-color: #2ea043;
            color: #fff;
        }
        .btn-primary:hover { background: #2ea043; }

        input[type="text"] {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            background: #30363d;
        }
        .badge.added { background: #1b4332; color: #95d5b2; }
        .badge.deleted { background: #4a1c1c; color: #f8a0a0; }
        .badge.modified { background: #3b2e00; color: #f0c040; }

        .meta { color: #8b949e; font-size: 13px; }
        .hash { font-family: monospace; font-size: 13px; color: #58a6ff; }

        .diff-block {
            margin-bottom: 16px;
            border: 1px solid #30363d;
            border-radius: 6px;
            overflow: hidden;
        }
        .diff-header {
            padding: 8px 16px;
            background: #1c2128;
            border-bottom: 1px solid #30363d;
            font-family: monospace;
            font-size: 13px;
        }
        .diff-line {
            padding: 1px 16px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .diff-line.add { background: #12261e; color: #7ee787; }
        .diff-line.del { background: #2d1214; color: #f8a0a0; }
        .diff-line.hunk { background: #1c2128; color: #8b949e; }

        .file-content {
            padding: 16px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
            background: #0d1117;
        }

        .breadcrumb {
            font-size: 14px;
            margin-bottom: 16px;
            color: #8b949e;
        }
        .breadcrumb a { color: #58a6ff; }

        .inline-form {
            display: inline-flex;
            gap: 8px;
            align-items: center;
        }

        .commit-graph {
            position: relative;
            padding-left: 24px;
        }
        .commit-node {
            position: relative;
            padding: 12px 16px;
            margin-bottom: 0;
            border-bottom: 1px solid #21262d;
        }
        .commit-node:last-child { border-bottom: none; }
        .commit-node::before {
            content: '';
            position: absolute;
            left: -16px;
            top: 18px;
            width: 10px;
            height: 10px;
            background: #58a6ff;
            border-radius: 50%;
        }
        .commit-node::after {
            content: '';
            position: absolute;
            left: -12px;
            top: 28px;
            width: 2px;
            height: calc(100% - 10px);
            background: #30363d;
        }
        .commit-node:last-child::after { display: none; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">MiniGit</a>
        <a href="/">Repositories</a>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
