{% extends "base.html" %}
{% block title %}{{ filename }} - {{ repo_name }} - MiniGit{% endblock %}

{% block content %}
<div class="breadcrumb">
    <a href="/">Repositories</a> /
    <a href="/repo/{{ repo_name }}">{{ repo_name }}</a> /
    <strong>{{ filename }}</strong>
</div>

<div class="card">
    <div class="card-header">
        <span>{{ filename }}</span>
        <span class="hash">{{ blob_hash[:8] }}</span>
    </div>
    <div class="card-body">
        <div class="file-content">{{ content }}</div>
    </div>
</div>
{% endblock %}
